name: Strict live frontend

on:
  pull_request:
    paths:
      - "artifacts/control-tower/**"
      - "scripts/check-strict-live-bundle.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/strict-live-frontend.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/control-tower/**"
      - "scripts/check-strict-live-bundle.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/strict-live-frontend.yml"

permissions:
  contents: read

jobs:
  typecheck-build-and-isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: "5000"
      BASE_PATH: "/"
      CONTROL_TOWER_MODE: live
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:live
      - run: pnpm run check:strict-live
