name: Strict live backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-migrate-and-configure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor -d monitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql://monitor:monitor@127.0.0.1:5432/monitor_test
      CONTROL_TOWER_MODE: live
      LIVE_CHURN_URL: https://producer.example/churn
      LIVE_CHATBOT_URL: https://producer.example/chatbot
      LIVE_NBA_URL: https://producer.example/nba
      LIVE_PRODUCER_URL: https://producer.example
      LIVE_TELEMETRY_TOKEN: ci-telemetry-token
      LIVE_WORKER_TOKEN: ci-worker-token
      ANTHROPIC_API_KEY: ci-anthropic-token
      LANGFUSE_PUBLIC_KEY: ci-public
      LANGFUSE_SECRET_KEY: ci-secret
      LIVE_POLL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app backend/scripts
      - run: python backend/scripts/migrate.py
      - name: Validate strict-live configuration
        run: python -c "from app import config; assert config.live_configuration_errors() == [], config.live_configuration_errors()"
      - run: python -m pytest -q backend/tests
